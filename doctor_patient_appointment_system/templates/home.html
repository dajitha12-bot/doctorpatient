{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 40px auto; text-align: center; padding: 40px 30px;">
    <div style="width: 56px; height: 56px; background: #eff6ff; color: #2563eb; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
        </svg>
    </div>

    <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 12px;">Hospital Queue & Appointment Tracker</h1>
    <p class="text-muted" style="font-size: 1.05rem; margin-bottom: 30px; line-height: 1.6;">
        Streamlined doctor-patient appointment booking, real-time live queue status tracking, and emergency priority management.
    </p>

    <div style="display: flex; gap: 14px; justify-content: center;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="padding: 12px 28px; font-size: 1rem;">Sign In</a>
        <a href="{% url 'register' %}" class="btn btn-secondary" style="padding: 12px 28px; font-size: 1rem;">Register Patient Account</a>
    </div>
</div>
{% endblock %}
