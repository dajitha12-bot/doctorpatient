{% extends 'base.html' %}
{% block content %}
<div class="card form-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #0f172a;">Patient Profile</h2>
        <p class="text-muted" style="margin-top: 4px;">View and edit your personal contact details</p>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Username (Read-only)</label>
            <input type="text" class="form-control" value="{{ request.user.username }}" disabled style="background-color: #f1f5f9;">
        </div>

        <div class="grid-2" style="gap: 12px; margin-bottom: 0;">
            <div class="form-group">
                <label for="id_first_name">First Name</label>
                {{ form.first_name }}
            </div>
            <div class="form-group">
                <label for="id_last_name">Last Name</label>
                {{ form.last_name }}
            </div>
        </div>

        <div class="form-group">
            <label for="id_email">Email Address</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label for="id_phone_number">Phone Number</label>
            {{ form.phone_number }}
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Save Profile Changes</button>
    </form>
</div>
{% endblock %}
