{% extends 'base.html' %}
{% block content %}
<div class="card form-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 1.5rem; font-weight: 700; color: #0f172a;">Sign In to Account</h2>
        <p class="text-muted" style="margin-top: 4px;">Access your patient, doctor, or receptionist portal</p>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger">
            <p>Invalid username or password. Please try again.</p>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <span class="text-muted">Don't have an account?</span>
        <a href="{% url 'register' %}" style="color: #2563eb; font-weight: 600; text-decoration: none; margin-left: 4px;">Register here</a>
    </div>
</div>
{% endblock %}
